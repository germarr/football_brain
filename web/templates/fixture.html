<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Match Tracker — {{ st.home }} v {{ st.away }}</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --ink:#12151b; --muted:#5b6572; --line:#e4e7ec;
    --accent:#2f6feb; --accent-ink:#fff; --chip:#eef1f5;
    --ok:#15803d; --fail:#b91c1c; --run:#2563eb;
    --live:#dc2626; --final:#6b7280; --prov:#b45309; --prov-bg:#fff7ed;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0e1116; --panel:#161b22; --ink:#e6edf3; --muted:#9aa4b2; --line:#283040;
      --accent:#4c8bf5; --chip:#1e2531;
      --ok:#4ade80; --fail:#f87171; --run:#60a5fa;
      --live:#f87171; --prov:#f59e0b; --prov-bg:#2a2011;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
    line-height:1.45;font-size:15px}
  a{color:var(--accent);text-decoration:none}
  header{padding:18px 28px;border-bottom:1px solid var(--line);background:var(--panel);
    display:flex;align-items:center;gap:14px}
  header .back{font-size:13px;font-weight:600;color:var(--muted)}
  header .back:hover{color:var(--accent)}
  main{max-width:760px;margin:0 auto;padding:26px 28px 80px}

  .headline{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px 22px 18px;margin-bottom:16px}
  .teams{display:flex;align-items:center;justify-content:center;gap:18px;text-align:center}
  .teams .t{font-size:20px;font-weight:660;flex:1;letter-spacing:-.01em}
  .teams .t.home{text-align:right} .teams .t.away{text-align:left}
  .teams .sc{font-size:30px;font-weight:760;font-variant-numeric:tabular-nums;
    min-width:96px;text-align:center;letter-spacing:-.02em}
  .teams .vs{font-size:16px;color:var(--muted);font-weight:600;min-width:96px;text-align:center}
  .meta{margin-top:12px;text-align:center;color:var(--muted);font-size:12.5px}
  .pill{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;
    background:var(--chip);color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
  .pill.live{color:#fff;background:var(--live)}
  .pill.final{color:var(--final)}
  .status-row{display:flex;justify-content:center;margin-top:10px}

  .freshness{display:flex;align-items:center;gap:8px;font-size:12.5px;margin:0 0 16px;
    padding:9px 13px;border-radius:9px;border:1px solid var(--line)}
  .freshness.prov{background:var(--prov-bg);border-color:var(--prov);color:var(--prov)}
  .freshness.auth{color:var(--muted)}
  .freshness .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .freshness.prov .dot{background:var(--prov)} .freshness.auth .dot{background:var(--ok)}
  .freshness b{font-weight:700}

  .controls{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:22px}
  button{font-family:var(--sans);font-weight:640;cursor:pointer;border:1px solid transparent;
    border-radius:9px;padding:8px 15px;font-size:13.5px}
  .btn-live{background:var(--accent);color:var(--accent-ink)}
  .btn-once{background:var(--panel);color:var(--ink);border-color:var(--line)}
  .btn-stop{background:var(--panel);color:var(--fail);border-color:var(--line)}
  .btn-clear{background:none;color:var(--muted);border-color:var(--line)}
  button:hover{filter:brightness(1.05)}
  button[hidden]{display:none}

  h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
    margin:0 0 10px;font-weight:700}
  .timeline{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .ev{display:flex;align-items:baseline;gap:12px;padding:9px 15px;border-bottom:1px solid var(--line)}
  .ev:last-child{border-bottom:none}
  .ev .clk{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px;
    min-width:44px;text-align:right;font-family:var(--mono)}
  .ev .ico{font-size:15px;min-width:20px;text-align:center}
  .ev .txt{font-size:13.5px}
  .empty{padding:20px 15px;color:var(--muted);font-size:13.5px;text-align:center}
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--fail);
    color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;font-weight:600;
    opacity:0;transition:opacity .2s;pointer-events:none}
  #toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <a class="back" href="/">← Back</a>
  {% include "_nav.html" ignore missing %}
</header>

<main>
  <div class="headline">
    <div class="teams">
      <div class="t home" id="home">—</div>
      <div class="sc" id="score">—</div>
      <div class="t away" id="away">—</div>
    </div>
    <div class="status-row"><span class="pill" id="status">—</span></div>
    <div class="meta" id="meta"></div>
  </div>

  <div class="freshness" id="freshness"><span class="dot"></span><span id="fresh-text"></span></div>

  <div class="controls">
    <button class="btn-live"  id="btn-live"  onclick="pollLive()">▶ Poll live (60s)</button>
    <button class="btn-once"  id="btn-once"  onclick="pollOnce()">↺ Poll once</button>
    <button class="btn-stop"  id="btn-stop"  onclick="stopPoll()" hidden>■ Stop</button>
    <button class="btn-clear" id="btn-clear" onclick="clearLive()" hidden>✕ Clear live data</button>
  </div>

  <h2>Timeline</h2>
  <div class="timeline" id="timeline"></div>
</main>
<div id="toast"></div>

<script id="init" type="application/json">{{ st|tojson }}</script>
<script>
const FIXTURE_ID = {{ st.id }};
let runningJob = {{ running_job|tojson }};
let current = null;

function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 3500); }

function ago(iso){
  if(!iso) return '';
  // polled_at is stored naive-UTC (e.g. "2026-07-12 15:42:00.123") — force UTC.
  const t = new Date(iso.replace(' ','T') + 'Z').getTime();
  if(isNaN(t)) return '';
  const s = Math.max(0, Math.round((Date.now()-t)/1000));
  if(s < 60) return s+'s ago';
  if(s < 3600) return Math.round(s/60)+'m ago';
  return Math.round(s/3600)+'h ago';
}

function render(st){
  if(!st){ toast('Fixture no longer available'); return; }
  current = st;
  document.getElementById('home').textContent = st.home;
  document.getElementById('away').textContent = st.away;
  const sc = document.getElementById('score');
  if(st.score){ sc.textContent = st.score; sc.className = 'sc'; }
  else { sc.textContent = 'vs'; sc.className = 'vs'; }

  const pill = document.getElementById('status');
  pill.textContent = st.status || 'NS';
  pill.className = 'pill' + (st.state==='live'?' live':st.state==='final'?' final':'');

  const d = st.date ? String(st.date).slice(0,10) : '';
  document.getElementById('meta').textContent =
    [st.league, st.round, d].filter(Boolean).join(' · ');

  // freshness / source
  const fresh = document.getElementById('freshness');
  const ft = document.getElementById('fresh-text');
  if(st.provisional){
    fresh.className = 'freshness prov';
    ft.innerHTML = '<b>Provisional</b> — Live Mirror, as of last poll'
      + (st.polled_at ? ' · '+ago(st.polled_at) : '');
  } else {
    fresh.className = 'freshness auth';
    ft.innerHTML = '<b>Snapshot</b> — from the daily serving store (start a poll to see it live)';
  }

  // timeline
  const tl = document.getElementById('timeline');
  if(!st.events || !st.events.length){
    tl.innerHTML = '<div class="empty">No events'
      + (st.state==='scheduled' ? ' yet — match not started.' : ' recorded.') + '</div>';
  } else {
    tl.innerHTML = st.events.map(e =>
      `<div class="ev"><span class="clk">${e.time||''}</span>`
      + `<span class="ico">${e.icon}</span><span class="txt"></span></div>`).join('');
    // set text via textContent to avoid injection
    tl.querySelectorAll('.ev .txt').forEach((n,i)=> n.textContent = st.events[i].text);
  }
  renderControls();
}

function renderControls(){
  document.getElementById('btn-stop').hidden = !runningJob;
  document.getElementById('btn-clear').hidden = !(current && current.provisional);
}

async function startRun(values){
  try{
    const res = await fetch('/run', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({key:'live_poll', values})});
    const data = await res.json();
    if(!res.ok){ toast(data.error || 'Failed to start'); return null; }
    return data.job_id;
  }catch(e){ toast('Request failed'); return null; }
}
async function pollLive(){
  const jid = await startRun({fixture_ids:[FIXTURE_ID], interval:60});
  if(jid){ runningJob = jid; renderControls(); toast('Polling live every 60s'); }
}
async function pollOnce(){
  const jid = await startRun({fixture_ids:[FIXTURE_ID], once:true});
  if(jid) toast('Polling once — updating shortly');
}
async function stopPoll(){
  if(!runningJob) return;
  try{ await fetch('/jobs/'+runningJob+'/stop', {method:'POST'}); }catch(e){}
  runningJob = null; renderControls(); toast('Stopped');
}
async function clearLive(){
  try{ await fetch('/fixture/'+FIXTURE_ID+'/clear', {method:'POST'}); }
  catch(e){ toast('Clear failed'); return; }
  toast('Cleared live data — reverting to snapshot');
  // the SSE will push the authoritative state on the next tick
}

// initial paint from server-embedded state, then live updates
render(JSON.parse(document.getElementById('init').textContent));
const es = new EventSource('/fixture/'+FIXTURE_ID+'/live');
es.addEventListener('state', e => render(JSON.parse(e.data)));
// keep the "as of Xs ago" line ticking even between pushes
setInterval(()=>{ if(current) render(current); }, 15000);
</script>
</body>
</html>

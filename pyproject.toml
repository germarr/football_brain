[project]
name = "alt_data"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "altair>=6.2.2",
    "anthropic>=0.116.0",
    "duckdb>=1.5.4",
    "fastapi>=0.139.0",
    # Direct, not incidental. Nine modules import it, and one requirement is specific:
    # the Polymarket CLOB sits behind Cloudflare and 403s a `Python-urllib` user agent
    # while httpx's default header set passes (ADR 0043). It arrived here as a transitive
    # dependency of `anthropic`, which would have removed it silently.
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "jinja2>=3.1.6",
    "marimo[sql]>=0.23.13",
    "numpy>=2.5.1",
    "pandas>=3.0.3",
    "plotly>=6.0.0",
    "polars[pyarrow]>=1.42.1",
    "psycopg[binary]>=3.3.4",
    "requests>=2.34.2",
    "sqlmodel>=0.0.39",
    "uvicorn>=0.50.2",
    "vl-convert-python>=1.9.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
]

# The suite is a refactoring harness, not a quality programme (ADR 0033): it covers
# the invariants a wrong path violates *without raising*, and nothing else.
[tool.pytest.ini_options]
testpaths = ["tests"]
# rootdir on sys.path, so `from scripts import preflight` and `from football import …`
# resolve the same way they do for `python -m …` from the repo root.
pythonpath = ["."]
addopts = "-q"
